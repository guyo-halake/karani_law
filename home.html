<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Billszip Advocates Remuneration System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
  }
  @media (max-width: 1024px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  .welcome-section {
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--glass-border);
  }

  .welcome-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .modern-card {
    background: var(--card-bg);
    border: var(--glass-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }
  .modern-card:hover {
    border-color: var(--glass-border-accent);
    transform: translateY(-1px);
  }

  .calc-card {
    background: var(--card-bg);
    border: var(--glass-border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }

  .activity-feed {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .activity-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding-bottom: 10px;
    border-bottom: var(--glass-border);
    font-size: 12px;
  }
  .activity-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .activity-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--card-hover-bg);
    border: var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent-gold);
  }

  .collapsible-section {
    transition: all 0.3s ease;
  }
  .collapsible-section.hidden {
    display: none;
  }

  .bottom-tables-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .bottom-tables-grid { grid-template-columns: 1fr; }
  }

  /* EXECUTIVE MODALS STYLING */
  .modal-dialog-box {
    max-width: 480px;
    background: var(--dropdown-bg);
    border: var(--glass-border);
    padding: 24px;
    border-radius: var(--radius-md);
    margin: 60px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<!-- Modal 1: Register New Client (Real-Time Saving) -->
<div class="modal-backdrop" id="clientModal" style="display:none;" onclick="if(event.target===this) closeClientModal()">
  <div class="modal-dialog-box">
    <h3 style="font-family:var(--font-brand); font-size:16px; color:var(--ink-primary); margin-bottom:14px; display:flex; align-items:center; gap:8px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent-gold)" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      Register New Law Firm Client
    </h3>
    
    <div id="clientErrorMsg" style="display:none; color:var(--accent-rose); font-size:11.5px; margin-bottom:10px; font-weight:600;"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="form-group" style="grid-column: span 2;">
        <label>Client or Entity Name</label>
        <input type="text" class="form-control" id="newClientName" placeholder="e.g. Acme Kenya Limited">
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label>Client Category</label>
        <select class="form-control" id="newClientCat">
          <option value="Corporate or Institutional">Corporate or Institutional</option>
          <option value="Individual Client">Individual Client</option>
        </select>
      </div>

      <div class="form-group">
        <label>KRA or Registration Number</label>
        <input type="text" class="form-control num" id="newClientKra" placeholder="P051123456Z">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" id="newClientEmail" placeholder="client@company.co.ke">
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label>Phone Number</label>
        <input type="text" class="form-control num" id="newClientPhone" placeholder="+254 700 000 000">
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-pill primary" style="flex:1; justify-content:center;" onclick="saveNewClientRealtime()">
        Save Client in Real-Time
      </button>
      <button class="btn-pill secondary" onclick="closeClientModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal 2: Add New Work (Strict Validation & Error Handling) -->
<div class="modal-backdrop" id="workLogModal" style="display:none;" onclick="if(event.target===this) closeWorkLogModal()">
  <div class="modal-dialog-box">
    <h3 style="font-family:var(--font-brand); font-size:16px; color:var(--ink-primary); margin-bottom:14px; display:flex; align-items:center; gap:8px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent-gold)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
      Add New Work
    </h3>

    <div id="workErrorMsg" style="display:none; color:var(--accent-rose); font-size:11.5px; margin-bottom:10px; font-weight:600;"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="form-group">
        <label>Work Date</label>
        <input type="date" class="form-control num" id="logDate">
      </div>
      <div class="form-group">
        <label>Select Active Matter</label>
        <select class="form-control" id="logMatterSelect">
          <option value="m1">Seyani v Green Hills (HCCC E104/2025)</option>
          <option value="m2">Dhanya Construction v Sunil Shah</option>
          <option value="m3">Faraja Restaurant Lease Renewal</option>
        </select>
      </div>
      <div class="form-group" style="grid-column: span 2;">
        <label>Particulars of Work Done</label>
        <input type="text" class="form-control" id="logParticulars" placeholder="e.g. Attendance at High Court hearing before Judge">
      </div>
      <div class="form-group">
        <label>Tariff Category</label>
        <select class="form-control" id="logTariffType">
          <option value="drawing">Drawing Pleadings (500/folio)</option>
          <option value="perusal">Perusals (50/folio)</option>
          <option value="attendance">Court Attendance (2500/hr)</option>
          <option value="disbursement">Disbursement (Kshs)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount / Folios (Kshs)</label>
        <input type="number" class="form-control num" id="logAmount" placeholder="2500">
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn-pill primary" style="flex:1; justify-content:center;" onclick="saveWorkLogEntry()">
        Save New Work Entry
      </button>
      <button class="btn-pill secondary" onclick="closeWorkLogModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="remuneration.js"></script>
<script src="shell.js"></script>
<script>
  renderShell({
    page: "home",
    title: "Advocates Command Center",
    searchPlaceholder: "Search matters, clients, or fee notes...",
    primaryAction: null
  });

  const data = window.APP_DATA;
  const rem = window.REMUNERATION;
  const content = document.getElementById("pageContent");

  let isSplitSectionHidden = false;

  function renderDashboard() {
    content.innerHTML = `
      <!-- Clean Welcome Section -->
      <div class="welcome-section">
        <div>
          <h1 style="font-family: var(--font-brand); font-size: 19px; font-weight: 800; color: var(--ink-primary);">
            Welcome back, V. Karani, Advocate
          </h1>
          <p style="font-size: 12px; color: var(--ink-secondary); margin-top: 2px;">
            Senior Partner & Advocate — Nyagah B. Kithinji & Co. Advocates
          </p>
        </div>

        <!-- Action Buttons Aligned on Far Right End -->
        <div class="welcome-actions">
          <a class="btn-pill primary" href="bill-of-costs-builder.html" style="display:inline-flex; align-items:center; gap:6px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            + Build Bill of Costs
          </a>
          <a class="btn-pill secondary" href="fee-notes.html" style="display:inline-flex; align-items:center; gap:6px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Fee Notes
          </a>
          <button class="btn-pill secondary" onclick="openWorkLogModal()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
            + Work Log
          </button>
          <button class="btn-pill secondary" onclick="openClientModal()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            + Register Client
          </button>
        </div>
      </div>

      <!-- Sleek Modern 4 KPI Metric Cards -->
      <div class="stat-grid">
        <div class="modern-card">
          <div style="font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px;">Active Matters & Cases</div>
          <div style="font-family:var(--font-brand); font-size:20px; font-weight:800; color:var(--ink-primary);">${data.matters.length} Active</div>
          <div style="font-size:11px; color:var(--ink-secondary); margin-top:2px;">1 Arbitration, 3 High Court, 1 Subordinate</div>
        </div>

        <div class="modern-card">
          <div style="font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px;">Registered Clients</div>
          <div style="font-family:var(--font-brand); font-size:20px; font-weight:800; color:var(--ink-primary);">${data.clients.length} Clients</div>
          <div style="font-size:11px; color:var(--ink-secondary); margin-top:2px;">Corporate & Individual client ledger</div>
        </div>

        <div class="modern-card">
          <div style="font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px;">Uncollected / Pending Fees</div>
          <div class="num" style="font-size:18px; font-weight:800; color:var(--ink-primary);">Kshs 30,820,193.28</div>
          <div style="font-size:11px; color:var(--ink-secondary); margin-top:2px;">Seyani v Green Hills pending taxation settlement</div>
        </div>

        <div class="modern-card">
          <div style="font-size:11px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px;">Work in Progress (Unbilled WIP)</div>
          <div class="num" style="font-size:18px; font-weight:800; color:var(--ink-primary);">Kshs 4,215,000.00</div>
          <div style="font-size:11px; color:var(--ink-secondary); margin-top:2px;">Accrued work entries ready to bill</div>
        </div>
      </div>

      <!-- Hideable Split-Screen Core Header -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="font-family:var(--font-brand); font-size:14.5px; font-weight:700; color:var(--ink-primary);">
          Remuneration Scale Calculator & Activity Feed
        </h2>
        <button class="btn-text" onclick="toggleSplitSection()">
          ${isSplitSectionHidden ? '[ Show Calculator & Activity ]' : '[ Hide Calculator & Activity ]'}
        </button>
      </div>

      <!-- Hideable Split-Screen Core Section -->
      <div class="collapsible-section ${isSplitSectionHidden ? 'hidden' : ''}" id="splitSection" style="margin-bottom:24px;">
        <div class="dashboard-grid">
          <!-- Left Side: Live Remuneration Scale Calculator Widget -->
          <div class="calc-card">
            <h3 style="font-family:var(--font-brand); font-size:13.5px; font-weight:700; color:var(--ink-primary); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
              <span style="display:flex; align-items:center; gap:6px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-gold)" stroke-width="2"><path d="m12 3-9 6h18l-9-6z"/><path d="M12 9v12"/><path d="M5 15h14"/><path d="m5 15-3 5h6l-3-5z"/><path d="m19 15-3 5h6l-3-5z"/></svg>
                Live Remuneration Scale Calculator
              </span>
              <span style="font-size:10px; color:var(--accent-gold);">LN 64/1962</span>
            </h3>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
              <div class="form-group" style="margin-bottom:0;">
                <label>Court Forum / Schedule</label>
                <select class="form-control" id="dashCourt" onchange="calcDashScale()">
                  <option value="High Court">Schedule 6 — High Court / ELC / ELRC</option>
                  <option value="Magistrate Court">Schedule 5 — Subordinate Court</option>
                  <option value="Conveyancing">Schedule 1 — Conveyancing & Mortgages</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Subject / Claim Value (Kshs)</label>
                <input type="number" class="form-control num" id="dashValue" value="5000000" oninput="calcDashScale()">
              </div>
            </div>

            <div id="dashCalcOutput" style="background:rgba(0,0,0,0.02); padding:10px 12px; border-radius:6px; border:var(--glass-border); font-size:11.5px; line-height:1.6;">
            </div>

            <button class="btn-pill primary" onclick="convertDashToBuilder()" style="width:100%; justify-content:center; margin-top:12px;">
              Convert into Full Bill of Costs →
            </button>
          </div>

          <!-- Right Side: Recent Law Firm Activity Feed -->
          <div class="calc-card">
            <h3 style="font-family:var(--font-brand); font-size:13.5px; font-weight:700; color:var(--ink-primary); margin-bottom:12px;">
              Recent Law Firm Activity Feed
            </h3>

            <div class="activity-feed">
              <div class="activity-item">
                <div class="activity-icon">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div>
                  <strong style="color:var(--ink-primary);">Bill of Costs BOC-2026-SEYANI Generated</strong>
                  <div style="color:var(--ink-secondary); font-size:11px;">Total Amount: <span class="num">Kshs 30,820,193.28</span></div>
                  <div style="color:var(--ink-muted); font-size:10px; margin-top:2px;">Today at 10:45 AM</div>
                </div>
              </div>

              <div class="activity-item">
                <div class="activity-icon">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-9 6h18l-9-6z"/><path d="M12 9v12"/><path d="M5 15h14"/><path d="m5 15-3 5h6l-3-5z"/><path d="m19 15-3 5h6l-3-5z"/></svg>
                </div>
                <div>
                  <strong style="color:var(--ink-primary);">Taxation Notice Filed</strong>
                  <div style="color:var(--ink-secondary); font-size:11px;">Cause No. HCCC E104/2025 — Seyani v Greenhills</div>
                  <div style="color:var(--ink-muted); font-size:10px; margin-top:2px;">Yesterday at 03:15 PM</div>
                </div>
              </div>

              <div class="activity-item">
                <div class="activity-icon">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/></svg>
                </div>
                <div>
                  <strong style="color:var(--ink-primary);">New Matter Created</strong>
                  <div style="color:var(--ink-secondary); font-size:11px;">Registered for Seyani Brothers & Co. (K) Limited</div>
                  <div style="color:var(--ink-muted); font-size:10px; margin-top:2px;">18th Aug 2026</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Split Tables Grid: Active Legal Matters & Recent Bills -->
      <div class="bottom-tables-grid">
        <!-- Left Table: Active Legal Matters Registry -->
        <div>
          <div class="section-head" style="margin: 0 0 10px;">
            <h2 style="font-size:14px;">Active Legal Matters</h2>
            <a href="matters.html" class="btn-text">View All Matters →</a>
          </div>

          <div class="table-card">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Cause Title</th>
                  <th>Court Forum</th>
                  <th class="num">Claim Value</th>
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${data.matters.map(m => `
                  <tr>
                    <td>
                      <strong style="color:var(--ink-primary); font-size:12px;">${m.title}</strong>
                      <div class="num" style="font-size:10.5px; color:var(--ink-muted);">${m.causeNo}</div>
                    </td>
                    <td><span style="color:var(--ink-secondary); font-size:11px;">${m.forum}</span></td>
                    <td class="num">${money(m.claimValue)}</td>
                    <td style="text-align: right;">
                      <a class="action-icon-btn" href="matter-detail.html?id=${m.id}" title="Case Hub">
                        ${TOP_ICONS.eye}
                      </a>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Right Table: Recent Bills & Fee Notes Registry -->
        <div>
          <div class="section-head" style="margin: 0 0 10px;">
            <h2 style="font-size:14px;">Recent Bills & Fee Notes</h2>
            <a href="fee-notes.html" class="btn-text">View Registry →</a>
          </div>

          <div class="table-card">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ref No</th>
                  <th>Client Name</th>
                  <th class="num">Amount (Kshs)</th>
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${data.feeNotes.map(f => `
                  <tr>
                    <td class="num" style="font-weight:700; color:var(--ink-primary);">${f.id.toUpperCase()}</td>
                    <td class="primary-cell">${f.client}</td>
                    <td class="num">${money(f.amount)}</td>
                    <td style="text-align: right;">
                      <a class="action-icon-btn" href="fee-note-detail.html?id=${f.id}" title="View Document">
                        ${TOP_ICONS.eye}
                      </a>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    calcDashScale();
  }

  window.toggleSplitSection = function() {
    isSplitSectionHidden = !isSplitSectionHidden;
    renderDashboard();
  };

  window.calcDashScale = function() {
    const court = document.getElementById("dashCourt").value;
    const value = Number(document.getElementById("dashValue").value) || 0;

    const calc = rem.computeBillOfCosts({
      courtLevel: court,
      claimValue: value,
      includeGettingUpFee: true,
      items: []
    });

    const output = document.getElementById("dashCalcOutput");
    output.innerHTML = `
      <div><strong>Scale:</strong> ${calc.instructionBreakdown.schedule}</div>
      <div><strong>Instruction Fee:</strong> <span class="num" style="font-weight:700; color:var(--ink-primary);">${money(calc.instructionBreakdown.instructionFee)}</span></div>
      <div><strong>1/3 Getting-Up Fee:</strong> <span class="num" style="font-weight:700; color:var(--ink-primary);">${money(calc.gettingUpFee)}</span></div>
      <div style="border-top:1px dashed var(--glass-border); margin-top:4px; padding-top:4px; font-weight:700;">
        Baseline Subtotal: <span class="num" style="color:var(--accent-emerald);">${money(calc.totalTaxableFees)}</span>
      </div>
    `;
  };

  window.convertDashToBuilder = function() {
    const court = document.getElementById("dashCourt").value;
    const value = document.getElementById("dashValue").value;
    window.location.href = `bill-of-costs-builder.html?court=${encodeURIComponent(court)}&value=${value}`;
  };

  /* REAL-TIME CLIENT REGISTRATION MODAL CONTROLS */
  window.openClientModal = function() {
    document.getElementById("clientErrorMsg").style.display = "none";
    document.getElementById("newClientName").value = "";
    document.getElementById("newClientKra").value = "";
    document.getElementById("newClientEmail").value = "";
    document.getElementById("newClientPhone").value = "";
    document.getElementById("clientModal").style.display = "block";
  };
  window.closeClientModal = function() {
    document.getElementById("clientModal").style.display = "none";
  };
  window.saveNewClientRealtime = function() {
    const name = document.getElementById("newClientName").value.trim();
    const cat = document.getElementById("newClientCat").value;
    const kra = document.getElementById("newClientKra").value.trim();
    const email = document.getElementById("newClientEmail").value.trim();
    const phone = document.getElementById("newClientPhone").value.trim();
    const errBox = document.getElementById("clientErrorMsg");

    if (!name) {
      errBox.innerText = "Error: Please enter the Client or Entity Name.";
      errBox.style.display = "block";
      return;
    }

    // Save in Real-Time to data.clients
    data.clients.push({
      id: "c" + (data.clients.length + 1),
      name: name,
      category: cat,
      kraPin: kra || "N/A",
      email: email || "info@client.co.ke",
      phone: phone || "+254 700 000 000",
      matters: 0
    });

    closeClientModal();
    alert(`Success: ${name} registered in real-time!`);
    renderDashboard();
  };

  /* ADD NEW WORK MODAL CONTROLS */
  window.openWorkLogModal = function() {
    document.getElementById("workErrorMsg").style.display = "none";
    document.getElementById("logParticulars").value = "";
    document.getElementById("logAmount").value = "";
    document.getElementById("logDate").value = new Date().toISOString().split("T")[0];
    document.getElementById("workLogModal").style.display = "block";
  };
  window.closeWorkLogModal = function() {
    document.getElementById("workLogModal").style.display = "none";
  };
  window.saveWorkLogEntry = function() {
    const particulars = document.getElementById("logParticulars").value.trim();
    const amount = document.getElementById("logAmount").value;
    const errBox = document.getElementById("workErrorMsg");

    if (!particulars) {
      errBox.innerText = "Error: Please enter the Particulars of Work Done.";
      errBox.style.display = "block";
      return;
    }

    if (!amount || Number(amount) <= 0) {
      errBox.innerText = "Error: Please enter a valid Amount / Folio quantity.";
      errBox.style.display = "block";
      return;
    }

    closeWorkLogModal();
    alert("Success: New work entry logged successfully!");
    renderDashboard();
  };

  renderDashboard();
</script>

</body>
</html>
