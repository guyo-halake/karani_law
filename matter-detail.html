<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case File Hub — Seyani v Green Hills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .matter-tabs {
    display: flex;
    gap: 4px;
    border-bottom: var(--glass-border);
    margin-bottom: 20px;
  }
  .matter-tab-btn {
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .matter-tab-btn.active {
    color: var(--ink-primary);
    border-bottom-color: var(--ink-primary);
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script src="data.js"></script>
<script src="remuneration.js"></script>
<script src="shell.js"></script>
<script>
  renderShell({
    page: "matters",
    title: "Case File Hub — 360 Case Management",
    searchPlaceholder: "Search case documents or logs...",
    primaryAction: null
  });

  const data = window.APP_DATA;
  const rem = window.REMUNERATION;
  const content = document.getElementById("pageContent");

  const urlParams = new URLSearchParams(window.location.search);
  const matterId = urlParams.get("id") || "m1";

  const matter = data.matters.find(m => m.id === matterId) || data.matters[0];
  const client = data.clients.find(c => c.id === matter.clientId) || data.clients[0];

  let currentTab = "overview";

  function renderMatterHub() {
    content.innerHTML = `
      <!-- Top Matter Banner -->
      <div class="stat-card" style="margin-bottom: 20px; border-left: 4px solid var(--ink-primary);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
          <div>
            <div style="font-size: 11px; font-weight: 700; color: var(--ink-secondary); text-transform: uppercase; letter-spacing: 0.4px;">
              ${matter.causeNo} — ${matter.forum}
            </div>
            <h1 style="font-family: var(--font-brand); font-size: 18px; font-weight: 800; color: var(--ink-primary); margin: 4px 0 2px;">
              ${matter.title}
            </h1>
            <p style="font-size: 12px; color: var(--ink-secondary);">
              Client: <a href="client-detail.html?id=${client.id}" style="color: var(--ink-primary); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;">${client.name}</a>
            </p>
          </div>
          
          <div style="display: flex; gap: 8px;">
            <a class="btn-pill primary" href="bill-of-costs-builder.html?matterId=${matter.id}&value=${matter.claimValue}&court=${encodeURIComponent(matter.forum)}">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
              Build Bill of Costs
            </a>
          </div>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="matter-tabs">
        <button class="matter-tab-btn ${currentTab === 'overview' ? 'active' : ''}" onclick="switchTab('overview')">Tab 1: Overview & Remuneration Audit</button>
        <button class="matter-tab-btn ${currentTab === 'timelog' ? 'active' : ''}" onclick="switchTab('timelog')">Tab 2: Itemized Work & Time Log</button>
        <button class="matter-tab-btn ${currentTab === 'feenotes' ? 'active' : ''}" onclick="switchTab('feenotes')">Tab 3: Fee Notes & Taxations</button>
        <button class="matter-tab-btn ${currentTab === 'calendar' ? 'active' : ''}" onclick="switchTab('calendar')">Tab 4: Case Calendar & Deadlines</button>
      </div>

      <div id="tabContent"></div>
    `;

    renderTabContent();
  }

  function renderTabContent() {
    const container = document.getElementById("tabContent");

    if (currentTab === "overview") {
      const calc = rem.computeBillOfCosts({
        courtLevel: matter.forum.includes("Magistrate") ? "Magistrate Court" : "High Court",
        claimValue: matter.claimValue,
        includeGettingUpFee: true,
        items: []
      });

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px;">
          <div>
            <div class="stat-card" style="margin-bottom: 20px;">
              <h3 style="font-family: var(--font-brand); font-size: 14px; font-weight: 700; color: var(--ink-primary); margin-bottom: 12px;">
                Case File Details & Legal Officers
              </h3>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 12px;">
                <div>
                  <span style="color: var(--ink-muted);">Presiding Judge / Arbitrator:</span><br>
                  <strong style="color: var(--ink-primary);">Hon. Arbitrator Tom Onyango Oketch, FCIArb</strong>
                </div>
                <div>
                  <span style="color: var(--ink-muted);">Opposing Advocate:</span><br>
                  <strong style="color: var(--ink-primary);">B.M Musyoki & Company Advocates</strong>
                </div>
                <div>
                  <span style="color: var(--ink-muted);">Subject Claim Value:</span><br>
                  <strong class="num" style="color: var(--ink-primary); font-size: 14px;">${money(matter.claimValue)}</strong>
                </div>
                <div>
                  <span style="color: var(--ink-muted);">Prescribed Remuneration Schedule:</span><br>
                  <strong style="color: var(--ink-primary);">${calc.schedule}</strong>
                </div>
              </div>
            </div>

            <div class="stat-card">
              <h3 style="font-family: var(--font-brand); font-size: 14px; font-weight: 700; color: var(--ink-primary); margin-bottom: 12px;">
                Current Case Progress & Remuneration Summary
              </h3>
              <p style="font-size: 12.5px; color: var(--ink-secondary); line-height: 1.6;">
                This matter is currently <strong>${matter.status}</strong>. All baseline instruction fees and getting-up fees are automatically calculated in real-time according to Schedule 6 of the Advocates Remuneration Order (LN 64/1962 ed. 2022).
              </p>
            </div>
          </div>

          <div>
            <div class="stat-card">
              <h3 style="font-family: var(--font-brand); font-size: 14px; font-weight: 700; color: var(--ink-primary); margin-bottom: 12px;">
                Baseline Fee Calculation
              </h3>
              <div style="font-size: 11.5px; line-height: 1.7; color: var(--ink-secondary);">
                <div>Instruction Fee: <strong class="num" style="color: var(--ink-primary);">${money(calc.instructionBreakdown.instructionFee)}</strong></div>
                <div>1/3 Getting-Up Fee: <strong class="num" style="color: var(--ink-primary);">${money(calc.gettingUpFee)}</strong></div>
                <div>16% VAT: <strong class="num" style="color: var(--ink-primary);">${money(calc.vatAmount)}</strong></div>
                <div style="border-top: var(--glass-border); margin-top: 8px; padding-top: 8px; font-weight: 700;">
                  ESTIMATED TOTAL: <span class="num" style="color: var(--ink-primary); font-size: 16px;">${money(calc.grandTotal)}</span>
                </div>
              </div>
              <a class="btn-pill primary" href="bill-of-costs-builder.html?matterId=${matter.id}&value=${matter.claimValue}&court=${encodeURIComponent(matter.forum)}" style="width: 100%; justify-content: center; margin-top: 14px;">
                ✏️ Build Bill of Costs for this Case
              </a>
            </div>
          </div>
        </div>
      `;
    } else if (currentTab === "timelog") {
      container.innerHTML = `
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Work Item / Particulars</th>
                <th>Category</th>
                <th class="num">Quant. / Folios</th>
                <th class="num" style="text-align: right;">Amount (Kshs)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="num">10.01.2026</td>
                <td>Drawing Claimant's Statement of Claim</td>
                <td>Pleadings Drawing</td>
                <td class="num">15.42 folios</td>
                <td class="num" style="text-align: right;">7,710.00</td>
              </tr>
              <tr>
                <td class="num">15.01.2026</td>
                <td>Judiciary E-Filing Fee Disbursement</td>
                <td>Disbursement</td>
                <td class="num">1</td>
                <td class="num" style="text-align: right;">12,500.00</td>
              </tr>
              <tr>
                <td class="num">20.02.2026</td>
                <td>Attending Full Day Hearing before Arbitrator</td>
                <td>Court Attendance</td>
                <td class="num">9 days</td>
                <td class="num" style="text-align: right;">90,000.00</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    } else if (currentTab === "feenotes") {
      container.innerHTML = `
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Fee Note Ref</th>
                <th>Date Issued</th>
                <th>Status</th>
                <th class="num">Amount (Kshs)</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="num" style="font-weight:700; color:var(--ink-primary);">BOC-2026-SEYANI</td>
                <td class="num">26.02.2026</td>
                <td><span class="status-pill pending"><span class="dot"></span> ${matter.status}</span></td>
                <td class="num">30,820,193.28</td>
                <td style="text-align: right;">
                  <a class="btn-pill secondary" href="fee-note-detail.html?id=fn1001">View Official Fee Note</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    } else if (currentTab === "calendar") {
      container.innerHTML = `
        <div class="table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Event / Deadline</th>
                <th>Date & Time</th>
                <th>Location / Registry</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Notice of Taxation Filing Deadline</td>
                <td class="num">15.03.2026 — 10:00 AM</td>
                <td>Milimani Commercial Registry</td>
                <td><span class="status-pill pending"><span class="dot"></span> Upcoming</span></td>
              </tr>
              <tr>
                <td>Mention for Award Delivery</td>
                <td class="num">28.03.2026 — 09:30 AM</td>
                <td>Lang'ata Patom House</td>
                <td><span class="status-pill pending"><span class="dot"></span> Scheduled</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
  }

  window.switchTab = function(tabName) {
    currentTab = tabName;
    renderMatterHub();
  };

  renderMatterHub();
</script>

</body>
</html>
