services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  billszip-legacy:
    build:
      context: ./Billszip
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always

networks:
  default:
    name: lexflow-network


