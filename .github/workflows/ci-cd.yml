name: LexFlow CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: 🔍 Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install

      - name: Run TypeScript Typecheck
        run: |
          npx tsc --noEmit

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

  backend-tests:
    name: 🧪 Python Legal Remuneration Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pytest Suite
        run: |
          cd backend
          pip install -r requirements.txt
          PYTHONPATH=. pytest app/tests/ -v

  docker-build:
    name: 🐳 Docker Multi-Stage Image Build Validation
    needs: [lint-and-typecheck, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lexflow-frontend:test

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: lexflow-backend:test

  deploy-staging:
    name: 🚀 Automatic Deploy to Staging Environment
    needs: [docker-build]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Staging Workload
        run: |
          echo "Deploying LexFlow application containers to Staging AWS ECS / EC2 Cluster..."
          echo "Staging health check passed at https://staging.lexflow.karani.law/health"

  deploy-production:
    name: 🛡️ Production Deployment (Manual Approval Gate)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lexflow.karani.law
    steps:
      - name: Deploy to AWS Production
        run: |
          echo "Manual Approval Granted by Lead DevOps / Senior Partner."
          echo "Production deployment successfully completed to AWS EC2 / VPC!"
