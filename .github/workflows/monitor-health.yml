name: 🩺 Production Azure & Docker Health Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically
  workflow_dispatch:        # Allows manual trigger at any time

jobs:
  health-check:
    name: 🌐 Azure Web App & API Health Probe
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure App Root (Frontend)
        id: ping_frontend
        run: |
          echo "Pinging https://nyagahkithinji-advocates.azurewebsites.net ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://nyagahkithinji-advocates.azurewebsites.net || echo "000")
          echo "Frontend HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "frontend_status=UP ($STATUS)" >> $GITHUB_ENV
          else
            echo "frontend_status=DOWN ($STATUS)" >> $GITHUB_ENV
          fi

      - name: Probe Backend Health Check (/api/v1/health)
        id: ping_backend
        run: |
          echo "Pinging https://nyagahkithinji-advocates.azurewebsites.net/api/v1/health ..."
          RESPONSE=$(curl -s --max-time 30 https://nyagahkithinji-advocates.azurewebsites.net/api/v1/health || echo '{"status":"offline"}')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "healthy"; then
            echo "backend_status=HEALTHY" >> $GITHUB_ENV
          else
            echo "backend_status=UNHEALTHY" >> $GITHUB_ENV
          fi

      - name: Probe Statutory Remuneration Engine (/api/v1/remuneration/schedules)
        id: ping_remuneration
        run: |
          echo "Verifying legal calculation schedules..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://nyagahkithinji-advocates.azurewebsites.net/api/v1/remuneration/schedules || echo "000")
          echo "Remuneration Endpoint Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "remuneration_status=UP ($STATUS)" >> $GITHUB_ENV
          else
            echo "remuneration_status=DOWN ($STATUS)" >> $GITHUB_ENV
          fi

      - name: Publish Health Report to GitHub Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🩺 Nyagah B. Fee Notes — Azure Health & Monitor Report

          | Component | Target URL | Status |
          |---|---|---|
          | **Web App Frontend** | `https://nyagahkithinji-advocates.azurewebsites.net` | ${{ env.frontend_status }} |
          | **FastAPI Backend Probe** | `https://nyagahkithinji-advocates.azurewebsites.net/api/v1/health` | ${{ env.backend_status }} |
          | **Remuneration Engine** | `https://nyagahkithinji-advocates.azurewebsites.net/api/v1/remuneration/schedules` | ${{ env.remuneration_status }} |

          *Monitored automatically via GitHub Actions & Microsoft Azure App Service.*
          EOF
