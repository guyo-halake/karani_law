name: Docker Multi-Container Verification & Smoke Test

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  docker-smoke-test:
    name: 🐳 Docker Build & Container Health Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Container
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: karani-backend:test

      # Run Backend Container & verify health endpoint
      - name: Smoke Test Backend Container
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e PORT=8000 \
            -e JWT_SECRET_KEY=smoke-test-secret-key-32-chars-long-1234567 \
            karani-backend:test
          
          # Wait up to 20 seconds for container startup
          for i in {1..20}; do
            if curl -s http://localhost:8000/api/v1/health | grep -q "healthy"; then
              echo "✓ Backend container is healthy and responding!"
              break
            fi
            echo "Waiting for container startup... ($i/20)"
            sleep 1
          done
          
          # Test Statutory Remuneration endpoint returns 200 OK
          curl -f http://localhost:8000/api/v1/remuneration/schedules
          docker stop test-api

      # Build Frontend Container
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: karani-frontend:test

      - name: Verify Frontend Image Integrity
        run: |
          docker images | grep karani-
