name: CI/CD Pipeline — Microsoft Azure Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: 🧪 Quality Gate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies & test
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend && PYTHONPATH=. pytest app/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

  build-and-deploy-azure:
    name: 🚀 Build & Deploy to Azure Web App for Containers
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_REGISTRY_SERVER: ${{ secrets.AZURE_REGISTRY_SERVER }}
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Azure Secrets Present
        run: |
          if [ -z "$AZURE_REGISTRY_SERVER" ]; then
            echo "⚠️ Notice: AZURE_REGISTRY_SERVER secret is not yet set in GitHub Settings -> Secrets."
            echo "To enable continuous Azure deployments, configure AZURE_REGISTRY_SERVER, AZURE_REGISTRY_USERNAME, AZURE_REGISTRY_PASSWORD, and AZURE_WEBAPP_NAME."
          else
            echo "✓ Azure credentials detected. Proceeding with ACR Docker build & deployment."
          fi

      - name: Log in to Azure Container Registry (ACR)
        if: env.AZURE_REGISTRY_SERVER != ''
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build & Push Backend Docker Image
        if: env.AZURE_REGISTRY_SERVER != ''
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:${{ github.sha }} -t ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:latest ./backend
          docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-backend:latest

      - name: Build & Push Frontend Docker Image
        if: env.AZURE_REGISTRY_SERVER != ''
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:${{ github.sha }} -t ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:latest .
          docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:${{ github.sha }}
          docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/karani-frontend:latest

      - name: Deploy Multi-Container Spec to Azure Web App
        if: env.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          configuration-file: ./azure/docker-compose.azure.yml
