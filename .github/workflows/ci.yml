name: CI Quality Gate — Frontend & Backend Verification

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # 1. FRONTEND VERIFICATION (TypeScript, Vite, Assets)
  frontend-verification:
    name: 🎨 Frontend (Node 20 / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Production Vite Build Bundle
        run: npm run build

  # 2. BACKEND VERIFICATION (Python 3.11, Pytest, Statutory Math)
  backend-verification:
    name: ⚖️ Backend (Python 3.11 / Pytest / Remuneration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Statutory Remuneration & Security Pytest Suite
        run: |
          cd backend
          PYTHONPATH=. pytest app/tests -v --durations=10
