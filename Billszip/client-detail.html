<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Profile Hub — Seyani Brothers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app"></div>

<script src="data.js"></script>
<script src="remuneration.js"></script>
<script src="shell.js"></script>
<script>
  renderShell({
    page: "clients",
    title: "Client Profile & Financial Hub",
    searchPlaceholder: "Search client documents...",
    primaryAction: null
  });

  const data = window.APP_DATA;
  const rem = window.REMUNERATION;
  const content = document.getElementById("pageContent");

  const urlParams = new URLSearchParams(window.location.search);
  const clientId = urlParams.get("id") || "c1";

  const client = data.clients.find(c => c.id === clientId) || data.clients[0];
  const clientMatters = data.matters.filter(m => m.clientId === client.id);
  const cleanPhone = client.phone.replace(/[^0-9]/g, '');

  content.innerHTML = `
    <!-- Top Banner Card -->
    <div class="stat-card" style="margin-bottom: 20px; border-left: 4px solid var(--ink-primary);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px;">
        <div>
          <div style="font-size: 11px; font-weight: 700; color: var(--ink-secondary); text-transform: uppercase; letter-spacing: 0.4px;">
            CORPORATE CLIENT PROFILE
          </div>
          <h1 style="font-family: var(--font-brand); font-size: 20px; font-weight: 800; color: var(--ink-primary); margin: 4px 0 2px;">
            ${client.name}
          </h1>
          <p style="font-size: 12px; color: var(--ink-secondary);">
            Email: <strong>${client.email}</strong> | Tel: <strong class="num">${client.phone}</strong>
          </p>
        </div>

        <!-- Direct Communication Action Buttons -->
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <a class="btn-pill secondary" href="https://wa.me/${cleanPhone}" target="_blank" style="color:#10B981; border-color:#10B981;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            WhatsApp Client
          </a>
          <a class="btn-pill secondary" href="mailto:${client.email}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Email Client
          </a>
          <a class="btn-pill secondary" href="tel:${client.phone}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Call Client
          </a>
          <button class="btn-pill primary" onclick="exportStatement()">
            📄 Statement of Account
          </button>
        </div>
      </div>
    </div>

    <!-- Client KYC Details Grid -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px;">
      <div class="stat-card">
        <div class="label">KRA PIN / Reg No</div>
        <div class="value num" style="font-size: 15px; color: var(--ink-primary);">P051988273K</div>
        <div class="delta">Verified Corporate Entity</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Billed Fees</div>
        <div class="value num" style="color: var(--ink-primary); font-size: 16px;">
          ${client.id === 'c1' ? 'Kshs 30,820,193.28' : 'Kshs 3,986,663.93'}
        </div>
        <div class="delta">Lifetime Billed</div>
      </div>
      <div class="stat-card">
        <div class="label">Outstanding Account Balance</div>
        <div class="value num" style="color: var(--ink-primary); font-size: 16px;">
          ${client.id === 'c1' ? 'Kshs 30,820,193.28' : 'Kshs 0.00'}
        </div>
        <div class="delta">${client.id === 'c1' ? 'Pending Invoice Settlement' : 'Account Settled'}</div>
      </div>
    </div>

    <!-- Client's Matters Directory -->
    <div class="section-head" style="margin: 20px 0 10px;">
      <h2>Legal Matters for ${client.name}</h2>
    </div>

    <div class="table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th>Cause Title</th>
            <th>Court Forum</th>
            <th>Status</th>
            <th class="num">Claim Value</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody>
          ${clientMatters.map(m => `
            <tr>
              <td>
                <strong style="color: var(--ink-primary);">${m.title}</strong>
                <div class="num" style="font-size: 11px; color: var(--ink-muted);">${m.causeNo}</div>
              </td>
              <td><span style="color: var(--ink-secondary); font-weight: 500;">${m.forum}</span></td>
              <td><span class="status-pill pending"><span class="dot"></span> ${m.status}</span></td>
              <td class="num">${money(m.claimValue)}</td>
              <td style="text-align: right;">
                <a class="btn-pill secondary" href="matter-detail.html?id=${m.id}">View Case Hub</a>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  window.exportStatement = function() {
    alert(`Statement of Account for ${client.name} generated! Total Balance: ${client.id === 'c1' ? 'Kshs 30,820,193.28' : 'Kshs 0.00'}`);
  };
</script>

</body>
</html>
