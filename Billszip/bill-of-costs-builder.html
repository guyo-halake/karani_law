<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill of Costs Builder — Billszip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .builder-grid {
      display: grid;
      grid-template-columns: 1fr 500px;
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-card {
      background: var(--card-bg);
      border: var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    @media (max-width: 640px) {
      .two-col-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      margin-bottom: 4px;
    }

    .form-control {
      height: 34px;
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 5px;
    }

    .item-entry-row {
      display: grid;
      grid-template-columns: 95px 1fr 130px 60px 85px 24px;
      gap: 6px;
      align-items: center;
      padding: 6px 8px;
      background: var(--card-bg);
      border: var(--glass-border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .preset-btn {
      padding: 4px 10px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      background: var(--card-bg);
      border: var(--glass-border);
      color: var(--accent-gold);
      cursor: pointer;
      transition: var(--transition);
    }

    .preset-btn:hover {
      background: var(--card-hover-bg);
      border-color: var(--accent-gold);
    }

    /* REALTIME PDF PAPER CANVAS PREVIEW STYLES */
    .paper-preview-sticky {
      position: sticky;
      top: 76px;
    }

    .live-paper-sheet {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 8px;
      padding: 32px 36px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      color: #0F172A !important;
      font-family: var(--font-body);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .paper-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #0F172A;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .paper-seal-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .paper-seal-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid #D97706;
      object-fit: cover;
    }

    .paper-firm-title {
      font-family: var(--font-brand);
      font-size: 15px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.15;
    }

    .paper-firm-sub {
      font-size: 10px;
      font-weight: 700;
      color: #D97706;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .paper-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 11px;
    }

    .paper-table th {
      background: #F8FAFC;
      border-bottom: 2px solid #0F172A;
      padding: 6px 8px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
    }

    .paper-table td {
      border-bottom: 1px solid #E2E8F0;
      padding: 6px 8px;
      color: #1E293B;
    }

    .paper-table td.num {
      font-family: var(--font-mono);
      font-weight: 600;
      text-align: right;
    }

    .paper-summary-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 14px;
    }

    .paper-summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .paper-summary-row.total {
      border-top: 2px solid #0F172A;
      padding-top: 6px;
      margin-top: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: #059669;
    }

    @media print {
      body * { visibility: hidden; }
      #livePaperSheet, #livePaperSheet * { visibility: visible; }
      #livePaperSheet {
        position: absolute;
        left: 0; top: 0;
        width: 100%;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app"></div>

  <script src="data.js"></script>
  <script src="remuneration.js"></script>
  <script src="shell.js"></script>
  <script>
    renderShell({
      page: "boc",
      title: "Intelligent Bill of Costs Builder",
      searchPlaceholder: "Search work items...",
      primaryAction: null
    });

    const rem = window.REMUNERATION;
    const content = document.getElementById("pageContent");

    const urlParams = new URLSearchParams(window.location.search);
    const initialValue = urlParams.get("value") || "500000";
    const initialCourt = urlParams.get("court") || "High Court";
    const initialMatterId = urlParams.get("matterId");

    let defaultClient = "Seyani Brothers & Co. Kenya Ltd";
    let defaultMatter = "HCCC E104/2025 — Seyani v Green Hills Ltd";
    if (initialMatterId && window.APP_DATA) {
      const m = window.APP_DATA.matters.find(x => x.id === initialMatterId);
      if (m) {
        defaultMatter = m.title + " (" + m.causeNo + ")";
        const cl = window.APP_DATA.clients.find(c => c.id === m.clientId);
        if (cl) defaultClient = cl.name;
      }
    }

    let itemsList = [];

    function renderBuilder() {
      content.innerHTML = `
      <div class="builder-grid">
        <!-- Main Form Left Inputs -->
        <div>
          <!-- Cause & Jurisdiction Configurations -->
          <div class="form-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: var(--glass-border); padding-bottom: 8px;">
              <h2 style="font-family: var(--font-brand); font-size: 13.5px; font-weight: 700; color: var(--ink-primary); display: flex; align-items: center; gap: 6px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-gold)" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg>
                Cause & Jurisdiction Configurations
              </h2>
              <span class="status-pill paid" style="font-size:10px; padding:2px 8px;">LN 64/1962 Compliant</span>
            </div>

            <!-- Two-Column Form Grid -->
            <div class="two-col-grid">
              <div class="form-group">
                <label>Client Name</label>
                <input type="text" class="form-control" id="bocClient" value="${defaultClient}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Matter / Cause Title</label>
                <input type="text" class="form-control" id="bocMatter" value="${defaultMatter}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Court Forum & Schedule</label>
                <select class="form-control" id="bocCourt" onchange="updateCalc()">
                  <option value="High Court" ${initialCourt.includes("High") ? "selected" : ""}>Schedule 6 — High Court / ELC / ELRC</option>
                  <option value="Magistrate Court" ${initialCourt.includes("Magistrate") ? "selected" : ""}>Schedule 5 — Subordinate / Magistrate's Court</option>
                  <option value="Conveyancing" ${initialCourt.includes("Conveyancing") ? "selected" : ""}>Schedule 1 — Conveyancing & Mortgages</option>
                </select>
              </div>

              <div class="form-group">
                <label>Subject / Claim Value (Kshs)</label>
                <input type="number" class="form-control num" id="bocValue" value="${initialValue}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Advocate Position</label>
                <select class="form-control" id="bocPosition" onchange="updateCalc()">
                  <option value="plaintiff">Plaintiff / Applicant Scale</option>
                  <option value="defendant">Defendant / Respondent Scale (85% Multiplier)</option>
                </select>
              </div>

              <div class="form-group">
                <label>1/3 Getting-Up Fee Rule</label>
                <select class="form-control" id="bocGettingUp" onchange="updateCalc()">
                  <option value="yes">Include 1/3 Getting-Up Fee (Hearing/Defense filed)</option>
                  <option value="no">Instruction Fee Only (No Getting-Up)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Itemized Work Entry Builder -->
          <div class="section-head" style="margin: 16px 0 10px; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-size: 13.5px; font-family:var(--font-brand); display:flex; align-items:center; gap:6px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Itemized Work Done & Disbursements
            </h2>
            <button class="btn-pill primary" onclick="addItemRow()">+ Add Work Item</button>
          </div>

          <!-- Quick Presets -->
          <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center;">
            <span style="font-size: 10.5px; color: var(--ink-muted); font-weight: 600;">Quick Presets:</span>
            <button class="preset-btn" onclick="addPreset('drawing_folio', 'Drawing Supporting Affidavit (10 folios)', 10)">+ Affidavit (10 folios)</button>
            <button class="preset-btn" onclick="addPreset('attendance_court_hr', 'Attendance in High Court for Mention (1 hr)', 1)">+ Court Mention (1 hr)</button>
            <button class="preset-btn" onclick="addPreset('letter_formal', 'Formal Demand Letter to Respondent', 1)">+ Demand Letter</button>
            <button class="preset-btn" onclick="addPreset('disbursement', 'Process Server Service Fee Disbursement', 1, 3500)">+ Process Server (Kshs 3,500)</button>
          </div>

          <!-- Items Table -->
          <div style="margin-bottom: 20px;">
            <div style="display: grid; grid-template-columns: 95px 1fr 130px 60px 85px 24px; gap: 6px; padding: 0 8px 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted);">
              <div>Date</div>
              <div>Particulars of Work Done</div>
              <div>Item Tariff Type</div>
              <div>Qty</div>
              <div style="text-align: right;">Amount</div>
              <div></div>
            </div>
            
            <div id="itemsContainer"></div>
          </div>
        </div>

        <!-- Right Side Real-Time PDF Paper Document Preview Canvas -->
        <div class="paper-preview-sticky">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size:11px; font-weight:800; color:var(--accent-gold); display:flex; align-items:center; gap:6px;">
              <span class="dot" style="background:#059669; width:8px; height:8px; border-radius:50%; display:inline-block;"></span>
              REAL-TIME PDF PAPER PREVIEW
            </span>
            <div style="display:flex; gap:8px;">
              <button class="btn-pill secondary" onclick="window.print()" style="font-size:11px; padding:4px 10px;">🖨️ Print / PDF</button>
              <button class="btn-pill primary" onclick="saveDraftOnly()" style="font-size:11px; padding:4px 12px;">Save Bill</button>
            </div>
          </div>

          <div class="live-paper-sheet" id="livePaperSheet">
            <div id="paperCanvasContent"></div>
          </div>
        </div>
      </div>
    `;

      renderItemRows();
      updateCalc();
    }

    function renderItemRows() {
      const container = document.getElementById("itemsContainer");
      if (itemsList.length === 0) {
        container.innerHTML = `
        <div style="padding: 16px; text-align: center; border: var(--glass-border); border-radius: var(--radius-sm); color: var(--ink-muted); font-size: 12px; background: var(--card-bg);">
          No custom work items added. Click <strong>'+ Add Work Item'</strong> or choose a preset above.
        </div>
      `;
        return;
      }

      container.innerHTML = itemsList.map((item, idx) => `
      <div class="item-entry-row">
        <input type="date" class="form-control num" value="${item.date}" onchange="updateItem(${idx}, 'date', this.value)">
        <input type="text" class="form-control" value="${item.particulars}" onchange="updateItem(${idx}, 'particulars', this.value)">
        <select class="form-control" onchange="updateItem(${idx}, 'type', this.value)">
          <option value="drawing_folio" ${item.type === 'drawing_folio' ? 'selected' : ''}>Drawing (500/folio)</option>
          <option value="copying_folio" ${item.type === 'copying_folio' ? 'selected' : ''}>Copying (50/folio)</option>
          <option value="attendance_court_hr" ${item.type === 'attendance_court_hr' ? 'selected' : ''}>Court Attend (2500/hr)</option>
          <option value="attendance_office_hr" ${item.type === 'attendance_office_hr' ? 'selected' : ''}>Office Attend (1500/hr)</option>
          <option value="letter_formal" ${item.type === 'letter_formal' ? 'selected' : ''}>Formal Letter (500)</option>
          <option value="letter_ordinary" ${item.type === 'letter_ordinary' ? 'selected' : ''}>Ordinary Letter (300)</option>
          <option value="disbursement" ${item.type === 'disbursement' ? 'selected' : ''}>Disbursement (Kshs)</option>
        </select>
        <input type="number" class="form-control num" value="${item.quantity}" min="0.5" step="0.5" oninput="updateItem(${idx}, 'quantity', this.value)">
        <input type="number" class="form-control num" value="${item.amount}" style="text-align:right;" oninput="updateItem(${idx}, 'amount', this.value)">
        <button onclick="removeItemRow(${idx})" style="background:none; border:none; color: var(--accent-rose); cursor:pointer; font-weight:bold; font-size:14px;" title="Remove Item">✕</button>
      </div>
    `).join("");
    }

    window.addItemRow = function () {
      itemsList.push({
        id: Date.now(),
        date: new Date().toISOString().split("T")[0],
        particulars: "",
        type: "drawing_folio",
        quantity: 1,
        amount: 0
      });
      renderItemRows();
      updateCalc();
    };

    window.addPreset = function (type, particulars, qty, amt = 0) {
      itemsList.push({
        id: Date.now(),
        date: new Date().toISOString().split("T")[0],
        particulars,
        type,
        quantity: qty,
        amount: amt
      });
      renderItemRows();
      updateCalc();
    };

    window.removeItemRow = function (idx) {
      itemsList.splice(idx, 1);
      renderItemRows();
      updateCalc();
    };

    window.updateItem = function (idx, field, val) {
      itemsList[idx][field] = field === 'quantity' || field === 'amount' ? Number(val) || 0 : val;
      updateCalc();
    };

    window.updateCalc = function () {
      const client = document.getElementById("bocClient").value || "Client Name Unspecified";
      const matter = document.getElementById("bocMatter").value || "Matter Title Unspecified";
      const court = document.getElementById("bocCourt").value;
      const value = Number(document.getElementById("bocValue").value) || 0;
      const isDef = document.getElementById("bocPosition").value === "defendant";
      const incGu = document.getElementById("bocGettingUp").value === "yes";

      const calculation = rem.computeBillOfCosts({
        courtLevel: court,
        claimValue: value,
        isDefendant: isDef,
        includeGettingUpFee: incGu,
        items: itemsList
      });

      const inst = calculation.instructionBreakdown;
      const today = new Date().toLocaleDateString("en-KE", { day: "numeric", month: "short", year: "numeric" });
      const refNo = "BOC-2026-" + Math.floor(1000 + Math.random() * 9000);

      document.getElementById("paperCanvasContent").innerHTML = `
        <div class="paper-header">
          <div class="paper-seal-brand">
            <img class="paper-seal-img" src="kenya_law_seal.jpg" alt="Seal">
            <div>
              <div class="paper-firm-title">Nyagah B. Kithinji & Co.</div>
              <div class="paper-firm-sub">Advocates & Legal Consultants</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:800; font-size:12px; color:#0F172A;">BILL OF COSTS / FEE NOTE</div>
            <div style="font-size:10.5px; color:#64748B;">REF: ${refNo}</div>
            <div style="font-size:10.5px; color:#64748B;">DATE: ${today}</div>
          </div>
        </div>

        <div style="margin-bottom:14px; background:#F8FAFC; padding:10px 12px; border-radius:6px; border:1px solid #E2E8F0;">
          <div style="font-size:10px; font-weight:700; color:#64748B; text-transform:uppercase;">CLIENT & CAUSE DETAILS</div>
          <div style="font-size:12px; font-weight:800; color:#0F172A;">${client}</div>
          <div style="font-size:11px; color:#475569;">RE: ${matter} (${court})</div>
        </div>

        <table class="paper-table">
          <thead>
            <tr>
              <th style="width:24px;">#</th>
              <th>Particulars of Statutory Fees & Work</th>
              <th style="text-align:right; width:95px;">Amount (Kshs)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1.</td>
              <td>
                <strong>Instruction Fee (${inst.schedule})</strong><br>
                <span style="font-size:10px; color:#64748B;">${inst.formula} (Claim Value: ${rem.formatMoney(value)})</span>
              </td>
              <td class="num">${rem.formatMoney(inst.instructionFee)}</td>
            </tr>
            ${incGu ? `
            <tr>
              <td>2.</td>
              <td>
                <strong>1/3 Getting-Up Fee (Rule 2)</strong><br>
                <span style="font-size:10px; color:#64748B;">Calculated as 1/3 of statutory instruction fee</span>
              </td>
              <td class="num">${rem.formatMoney(calculation.gettingUpFee)}</td>
            </tr>
            ` : ''}
            ${itemsList.map((item, idx) => `
            <tr>
              <td>${incGu ? idx + 3 : idx + 2}.</td>
              <td>
                ${item.particulars || 'Itemized Legal Service'}<br>
                <span style="font-size:10px; color:#64748B;">Qty: ${item.quantity} | Tariff: ${item.type}</span>
              </td>
              <td class="num">${rem.formatMoney(item.amount)}</td>
            </tr>
            `).join("")}
          </tbody>
        </table>

        <div class="paper-summary-box">
          <div class="paper-summary-row">
            <span>Subtotal Taxable Legal Fees</span>
            <strong class="num">${rem.formatMoney(calculation.totalTaxableFees)}</strong>
          </div>
          <div class="paper-summary-row">
            <span>VAT (16% Statutory Tax)</span>
            <strong class="num">${rem.formatMoney(calculation.vatAmount)}</strong>
          </div>
          <div class="paper-summary-row">
            <span>Out-of-Pocket Disbursements</span>
            <strong class="num">${rem.formatMoney(calculation.totalDisbursements)}</strong>
          </div>
          <div class="paper-summary-row total">
            <span>GRAND TOTAL AMOUNT DUE</span>
            <span class="num">${rem.formatMoney(calculation.grandTotal)}</span>
          </div>
        </div>
      `;

      window.currentCalculationData = calculation;
    };

    window.saveDraftOnly = function () {
      const client = document.getElementById("bocClient").value || "Unspecified Client";
      const draft = buildDraftPayload(client);
      rem.saveDraft(draft);
      alert("Success: Bill of Costs draft saved to workspace!");
    };

    function buildDraftPayload(client) {
      const matter = document.getElementById("bocMatter").value;
      const court = document.getElementById("bocCourt").value;
      const value = Number(document.getElementById("bocValue").value) || 0;
      const isDef = document.getElementById("bocPosition").value === "defendant";
      const incGu = document.getElementById("bocGettingUp").value === "yes";

      return {
        id: "boc_" + Date.now(),
        client,
        matter,
        courtLevel: court,
        claimValue: value,
        isDefendant: isDef,
        includeGettingUpFee: incGu,
        items: itemsList,
        computed: window.currentCalculationData
      };
    }

    renderBuilder();
  </script>
  <script src="tour.js"></script>

</body>

</html>
