<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill of Costs Builder — Billszip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .builder-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
  }
  @media (max-width: 1024px) {
    .builder-grid { grid-template-columns: 1fr; }
  }
  .form-card {
    background: var(--card-bg);
    border: var(--glass-border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  
  /* NORMAL COMPACT 2-COLUMN FORM GRID */
  .two-col-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  @media (max-width: 640px) {
    .two-col-grid { grid-template-columns: 1fr; }
  }

  .form-group {
    margin-bottom: 0;
  }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-bottom: 3px;
  }
  .form-control {
    height: 32px;
    padding: 5px 9px;
    font-size: 12px;
    border-radius: 5px;
  }

  .item-entry-row {
    display: grid;
    grid-template-columns: 100px 1fr 140px 65px 90px 28px;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    background: var(--card-bg);
    border: var(--glass-border);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
  }
  .audit-panel {
    background: var(--card-bg);
    border: var(--glass-border-accent);
    border-radius: var(--radius-md);
    padding: 14px;
    position: sticky;
    top: 70px;
    box-shadow: var(--shadow-sm);
  }
  .audit-step-row {
    padding: 6px 0;
    border-bottom: 1px dashed var(--glass-border);
    font-size: 11.5px;
  }
  .preset-btn {
    padding: 3px 8px;
    font-size: 10.5px;
    border-radius: var(--radius-pill);
    background: var(--card-bg);
    border: var(--glass-border);
    color: var(--accent-gold);
    cursor: pointer;
    transition: var(--transition);
  }
  .preset-btn:hover {
    background: var(--card-hover-bg);
    border-color: var(--accent-gold);
  }
  .side-by-side-btn-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .side-by-side-btn-row .btn-pill {
    flex: 1;
    justify-content: center;
    padding: 7px;
    font-size: 11.5px;
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script src="data.js"></script>
<script src="remuneration.js"></script>
<script src="shell.js"></script>
<script>
  renderShell({
    page: "boc",
    title: "Intelligent Bill of Costs Builder",
    searchPlaceholder: "Search work items...",
    primaryAction: null
  });

  const rem = window.REMUNERATION;
  const content = document.getElementById("pageContent");

  const urlParams = new URLSearchParams(window.location.search);
  const initialValue = urlParams.get("value") || "";
  const initialCourt = urlParams.get("court") || "High Court";
  const initialMatterId = urlParams.get("matterId");

  let defaultClient = "";
  let defaultMatter = "";
  if (initialMatterId && window.APP_DATA) {
    const m = window.APP_DATA.matters.find(x => x.id === initialMatterId);
    if (m) {
      defaultMatter = m.title + " (" + m.causeNo + ")";
      const cl = window.APP_DATA.clients.find(c => c.id === m.clientId);
      if (cl) defaultClient = cl.name;
    }
  }

  let itemsList = [];

  function renderBuilder() {
    content.innerHTML = `
      <div class="builder-grid">
        <!-- Main Form Left Canvas -->
        <div>
          <!-- Cause & Jurisdiction Configurations (Normal Compact Form) -->
          <div class="form-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: var(--glass-border); padding-bottom: 8px;">
              <h2 style="font-family: var(--font-brand); font-size: 13.5px; font-weight: 700; color: var(--ink-primary); display: flex; align-items: center; gap: 6px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-gold)" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg>
                Cause & Jurisdiction Configurations
              </h2>
              <span class="status-pill draft" style="font-size:10px; padding:2px 8px;">LN 64/1962 Compliant</span>
            </div>

            <!-- Normal Compact Two-Column Form -->
            <div class="two-col-grid">
              <div class="form-group">
                <label>Client Name</label>
                <input type="text" class="form-control" id="bocClient" value="${defaultClient}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Matter / Cause Title</label>
                <input type="text" class="form-control" id="bocMatter" value="${defaultMatter}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Court Forum & Schedule</label>
                <select class="form-control" id="bocCourt" onchange="updateCalc()">
                  <option value="High Court" ${initialCourt.includes("High") ? "selected" : ""}>Schedule 6 — High Court / ELC / ELRC</option>
                  <option value="Magistrate Court" ${initialCourt.includes("Magistrate") ? "selected" : ""}>Schedule 5 — Subordinate / Magistrate's Court</option>
                  <option value="Conveyancing" ${initialCourt.includes("Conveyancing") ? "selected" : ""}>Schedule 1 — Conveyancing & Mortgages</option>
                </select>
              </div>

              <div class="form-group">
                <label>Subject / Claim Value (Kshs)</label>
                <input type="number" class="form-control num" id="bocValue" value="${initialValue}" oninput="updateCalc()">
              </div>

              <div class="form-group">
                <label>Advocate Position</label>
                <select class="form-control" id="bocPosition" onchange="updateCalc()">
                  <option value="plaintiff">Plaintiff / Applicant Scale</option>
                  <option value="defendant">Defendant / Respondent Scale (85% Multiplier)</option>
                </select>
              </div>

              <div class="form-group">
                <label>1/3 Getting-Up Fee Rule</label>
                <select class="form-control" id="bocGettingUp" onchange="updateCalc()">
                  <option value="yes">Include 1/3 Getting-Up Fee (Hearing/Defense filed)</option>
                  <option value="no">Instruction Fee Only (No Getting-Up)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Itemized Work Entry Builder -->
          <div class="section-head" style="margin: 14px 0 8px;">
            <h2 style="font-size: 13.5px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Itemized Work Done & Disbursements
            </h2>
            <div style="display: flex; gap: 6px;">
              <button class="btn-pill primary" onclick="addItemRow()">+ Add Work Item</button>
            </div>
          </div>

          <!-- Quick Presets -->
          <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center;">
            <span style="font-size: 10.5px; color: var(--ink-muted); font-weight: 600;">Quick Presets:</span>
            <button class="preset-btn" onclick="addPreset('drawing_folio', 'Drawing Supporting Affidavit (10 folios)', 10)">+ Affidavit (10 folios)</button>
            <button class="preset-btn" onclick="addPreset('attendance_court_hr', 'Attendance in High Court for Mention (1 hr)', 1)">+ Court Mention (1 hr)</button>
            <button class="preset-btn" onclick="addPreset('letter_formal', 'Formal Demand Letter to Respondent', 1)">+ Demand Letter</button>
            <button class="preset-btn" onclick="addPreset('disbursement', 'Process Server Service Fee Disbursement', 1, 3500)">+ Process Server (Kshs 3,500)</button>
          </div>

          <!-- Items Table -->
          <div style="margin-bottom: 16px;">
            <div style="display: grid; grid-template-columns: 100px 1fr 140px 65px 90px 28px; gap: 6px; padding: 0 8px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--ink-muted);">
              <div>Date</div>
              <div>Particulars of Work Done</div>
              <div>Item Tariff Type</div>
              <div>Folio/Qty</div>
              <div style="text-align: right;">Amount</div>
              <div></div>
            </div>
            
            <div id="itemsContainer"></div>
          </div>
        </div>

        <!-- Right Side Realtime Legal Audit Sidebar -->
        <div>
          <div class="audit-panel">
            <h3 style="font-family: var(--font-brand); font-size: 13.5px; font-weight: 700; color: var(--ink-primary); margin-bottom: 10px; border-bottom: var(--glass-border); padding-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
              <span style="display:flex; align-items:center; gap:6px;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--accent-gold)" stroke-width="2"><path d="m12 3-9 6h18l-9-6z"/><path d="M12 9v12"/><path d="M5 15h14"/><path d="m5 15-3 5h6l-3-5z"/><path d="m19 15-3 5h6l-3-5z"/></svg>
                Realtime Legal Audit
              </span>
              <span style="font-size: 10px; color: var(--accent-gold); font-weight: 600;">LN 64/1962</span>
            </h3>

            <div id="auditContent"></div>

            <div style="margin-top: 14px; border-top: var(--glass-border); padding-top: 12px;">
              <div class="side-by-side-btn-row">
                <button class="btn-pill primary" onclick="saveAndGenerateFinot()">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  Generate Fee Note
                </button>
                <button class="btn-pill secondary" onclick="saveDraftOnly()">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  Save Draft
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    renderItemRows();
    updateCalc();
  }

  function renderItemRows() {
    const container = document.getElementById("itemsContainer");
    if (itemsList.length === 0) {
      container.innerHTML = `
        <div style="padding: 18px; text-align: center; border: var(--glass-border); border-radius: var(--radius-sm); color: var(--ink-muted); font-size: 12px; background: var(--card-bg);">
          No work items added yet. Click <strong>'+ Add Work Item'</strong> or choose a preset above to add work entries.
        </div>
      `;
      return;
    }

    container.innerHTML = itemsList.map((item, idx) => `
      <div class="item-entry-row">
        <input type="date" class="form-control num" value="${item.date}" onchange="updateItem(${idx}, 'date', this.value)">
        <input type="text" class="form-control" value="${item.particulars}" onchange="updateItem(${idx}, 'particulars', this.value)">
        <select class="form-control" onchange="updateItem(${idx}, 'type', this.value)">
          <option value="drawing_folio" ${item.type === 'drawing_folio' ? 'selected' : ''}>Drawing (500/folio)</option>
          <option value="copying_folio" ${item.type === 'copying_folio' ? 'selected' : ''}>Copying (50/folio)</option>
          <option value="attendance_court_hr" ${item.type === 'attendance_court_hr' ? 'selected' : ''}>Court Attend (2500/hr)</option>
          <option value="attendance_office_hr" ${item.type === 'attendance_office_hr' ? 'selected' : ''}>Office Attend (1500/hr)</option>
          <option value="letter_formal" ${item.type === 'letter_formal' ? 'selected' : ''}>Formal Letter (500)</option>
          <option value="letter_ordinary" ${item.type === 'letter_ordinary' ? 'selected' : ''}>Ordinary Letter (300)</option>
          <option value="disbursement" ${item.type === 'disbursement' ? 'selected' : ''}>Disbursement (Kshs)</option>
        </select>
        <input type="number" class="form-control num" value="${item.quantity}" min="0.5" step="0.5" oninput="updateItem(${idx}, 'quantity', this.value)">
        <input type="number" class="form-control num" value="${item.amount}" style="text-align:right;" oninput="updateItem(${idx}, 'amount', this.value)">
        <button onclick="removeItemRow(${idx})" style="background:none; border:none; color: var(--accent-rose); cursor:pointer; font-weight:bold; font-size:14px;" title="Remove Item">✕</button>
      </div>
    `).join("");
  }

  window.addItemRow = function() {
    itemsList.push({
      id: Date.now(),
      date: new Date().toISOString().split("T")[0],
      particulars: "",
      type: "drawing_folio",
      quantity: 1,
      amount: 0
    });
    renderItemRows();
    updateCalc();
  };

  window.addPreset = function(type, particulars, qty, amt = 0) {
    itemsList.push({
      id: Date.now(),
      date: new Date().toISOString().split("T")[0],
      particulars,
      type,
      quantity: qty,
      amount: amt
    });
    renderItemRows();
    updateCalc();
  };

  window.removeItemRow = function(idx) {
    itemsList.splice(idx, 1);
    renderItemRows();
    updateCalc();
  };

  window.updateItem = function(idx, field, val) {
    itemsList[idx][field] = field === 'quantity' || field === 'amount' ? Number(val) || 0 : val;
    updateCalc();
  };

  window.updateCalc = function() {
    const court = document.getElementById("bocCourt").value;
    const value = Number(document.getElementById("bocValue").value) || 0;
    const isDef = document.getElementById("bocPosition").value === "defendant";
    const incGu = document.getElementById("bocGettingUp").value === "yes";

    const calculation = rem.computeBillOfCosts({
      courtLevel: court,
      claimValue: value,
      isDefendant: isDef,
      includeGettingUpFee: incGu,
      items: itemsList
    });

    const inst = calculation.instructionBreakdown;

    document.getElementById("auditContent").innerHTML = `
      <div class="audit-step-row">
        <div style="font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;">1. Instruction Fee Scale (${inst.schedule})</div>
        <div class="num" style="font-size: 13.5px; font-weight: 700; color: var(--ink-primary); margin-top: 1px;">${rem.formatMoney(inst.instructionFee)}</div>
        <div style="font-size: 10.5px; color: var(--accent-cyan); margin-top: 1px;">${inst.formula}</div>
      </div>

      <div class="audit-step-row">
        <div style="font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;">2. Getting-Up Fee (1/3 Rule)</div>
        <div class="num" style="font-size: 13.5px; font-weight: 700; color: var(--ink-primary); margin-top: 1px;">${rem.formatMoney(calculation.gettingUpFee)}</div>
        <div style="font-size: 10.5px; color: var(--ink-secondary); margin-top: 1px;">${incGu ? '1/3 of instruction fee applied' : 'Not applicable'}</div>
      </div>

      <div class="audit-step-row">
        <div style="font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;">3. Itemized Taxable Work</div>
        <div class="num" style="font-size: 13.5px; font-weight: 700; color: var(--ink-primary); margin-top: 1px;">${rem.formatMoney(calculation.itemizedTaxableFees)}</div>
        <div style="font-size: 10.5px; color: var(--ink-secondary); margin-top: 1px;">${itemsList.length} itemized work entries</div>
      </div>

      <div class="audit-step-row">
        <div style="font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;">4. Subtotal Taxable Legal Fees</div>
        <div class="num" style="font-size: 14px; font-weight: 700; color: var(--ink-primary); margin-top: 1px;">${rem.formatMoney(calculation.totalTaxableFees)}</div>
      </div>

      <div class="audit-step-row">
        <div style="font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase;">5. Disbursements & VAT (16%)</div>
        <div style="font-size: 11.5px; color: var(--ink-secondary);">Disbursements: <strong class="num" style="color:var(--ink-primary);">${rem.formatMoney(calculation.totalDisbursements)}</strong></div>
        <div style="font-size: 11.5px; color: var(--ink-secondary);">VAT (16%): <strong class="num" style="color:var(--ink-primary);">${rem.formatMoney(calculation.vatAmount)}</strong></div>
      </div>

      <div style="padding-top: 10px;">
        <div style="font-size: 10.5px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.4px;">TOTAL TAXABLE BILL OF COSTS</div>
        <div class="num" style="font-size: 18px; font-weight: 700; color: var(--accent-emerald); margin-top: 2px;">${rem.formatMoney(calculation.grandTotal)}</div>
      </div>
    `;

    window.currentCalculationData = calculation;
  };

  window.saveDraftOnly = function() {
    const client = document.getElementById("bocClient").value || "Unspecified Client";
    const draft = buildDraftPayload(client);
    rem.saveDraft(draft);
    alert("Bill of Costs draft saved to workspace!");
  };

  window.saveAndGenerateFinot = function() {
    const client = document.getElementById("bocClient").value || "Unspecified Client";
    const draft = buildDraftPayload(client);
    rem.saveDraft(draft);
    window.location.href = "fee-note-detail.html?id=" + draft.id;
  };

  function buildDraftPayload(client) {
    const matter = document.getElementById("bocMatter").value;
    const court = document.getElementById("bocCourt").value;
    const value = Number(document.getElementById("bocValue").value) || 0;
    const isDef = document.getElementById("bocPosition").value === "defendant";
    const incGu = document.getElementById("bocGettingUp").value === "yes";

    return {
      id: "boc_" + Date.now(),
      client,
      matter,
      courtLevel: court,
      claimValue: value,
      isDefendant: isDef,
      includeGettingUpFee: incGu,
      items: itemsList,
      computed: window.currentCalculationData
    };
  }

  renderBuilder();
</script>

</body>
</html>
