<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Advocate Account — Billszip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* STRICT LIGHT THEME SIGN UP */
  html, body {
    background: #F8FAFC !important;
    color: #0F172A !important;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    font-family: var(--font-body);
  }
  
  .signup-wrapper {
    width: 100%;
    max-width: 440px;
  }
  
  .signup-brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .signup-brand img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #D97706;
    margin-bottom: 10px;
  }
  
  .form-control-light {
    width: 100%;
    height: 38px;
    background: #FFFFFF !important;
    border: 1px solid #CBD5E1 !important;
    border-radius: 6px;
    padding: 8px 12px;
    color: #0F172A !important;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }
  .form-control-light:focus {
    border-color: #D97706 !important;
  }
</style>
</head>
<body class="light-theme">

<div class="signup-wrapper">
  <!-- Brand Header -->
  <div class="signup-brand">
    <img src="kenya_law_seal.jpg" alt="Firm Seal Logo">
    <h1 style="font-family:var(--font-brand); font-size:20px; font-weight:800; color:#0F172A;">CREATE ADVOCATE ACCOUNT</h1>
    <div style="font-size:11px; font-weight:700; color:#D97706; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;">
      ADVOCATES REMUNERATION SYSTEM
    </div>
  </div>

  <!-- Clean Form -->
  <form onsubmit="handleSignup(event)">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
      <div class="form-group" style="grid-column: span 2;">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Law Firm Name</label>
        <select class="form-control-light" id="firmSelect" required>
          <option value="Nyagah B. Kithinji & Co. Advocates">Nyagah B. Kithinji & Co. Advocates</option>
        </select>
      </div>

      <div class="form-group">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Advocate LSK Roll No</label>
        <input type="text" class="form-control-light num" required placeholder="e.g. P.105/9920">
      </div>

      <div class="form-group">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Lead Advocate Name</label>
        <input type="text" class="form-control-light" required placeholder="e.g. B. Kithinji, Advocate">
      </div>

      <div class="form-group" style="grid-column: span 2;">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Work Email Address</label>
        <input type="email" class="form-control-light" required placeholder="bkithinji@nbkco-advocates.com">
      </div>

      <div class="form-group">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Password</label>
        <input type="password" class="form-control-light" id="pwd" required placeholder="••••••••••••">
      </div>

      <div class="form-group">
        <label style="color:#475569; font-weight:600; font-size:11.5px; text-transform:uppercase;">Confirm Password</label>
        <input type="password" class="form-control-light" id="confirmPwd" required placeholder="••••••••••••">
      </div>
    </div>

    <button type="submit" class="btn-pill primary" style="width:100%; justify-content:center; padding:10px; font-size:13px; margin-bottom:16px;">
      Create Account →
    </button>

    <div style="text-align:center; font-size:12px; color:#64748B;">
      Already registered? <a href="login.html" style="color:#D97706; font-weight:700; text-decoration:none;">Sign In Here</a>
    </div>
  </form>
</div>

<script>
  function handleSignup(e) {
    e.preventDefault();
    const p1 = document.getElementById("pwd").value;
    const p2 = document.getElementById("confirmPwd").value;
    if (p1 !== p2) {
      alert("Passwords do not match!");
      return;
    }
    alert("Advocate account created successfully!");
    window.location.href = "home.html";
  }
</script>

</body>
</html>
